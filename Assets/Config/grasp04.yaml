# grasp04: fine-tune grasp03 on the belt (Main scene, AssemblyGraspAgent with Training Mode on)
# Run from the Unity project folder:
#   conda activate mlagents
#   mlagents-learn config/grasp04.yaml --run-id=grasp04 --initialize-from=grasp03
# Changes from grasp03:
#   learning_rate 3e-4 -> 1e-4 (small updates to an already trained model)
#   beta 1e-2 -> 5e-3 (less random exploration)
#   max_steps 12000 -> 4000 (fine-tuning; step count restarts at 0)
#   checkpoint_interval 1000 -> 500 (more intermediate models to choose from)
# network_settings must stay identical to grasp03 (initialize-from loads its weights).
behaviors:
  Grasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4000
    time_horizon: 8
    summary_freq: 250
    checkpoint_interval: 500
    keep_checkpoints: 20
