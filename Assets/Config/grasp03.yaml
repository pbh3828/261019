# Train from scratch (run from the Unity project folder):
#   conda activate mlagents
#   mlagents-learn config/grasp03.yaml --run-id=grasp03
# Same as grasp02 except: learning rate decays linearly, fewer max_steps, checkpoints every 1000 steps.
behaviors:
  Grasp:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 256
      learning_rate: 3.0e-4
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 12000
    time_horizon: 8
    summary_freq: 250
    checkpoint_interval: 1000
    keep_checkpoints: 20